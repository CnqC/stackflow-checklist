// Top-level build file where you can add configuration options common to all sub-projects/modules.

buildscript {
    
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        classpath 'com.android.tools.build:gradle:8.13.0'
        classpath 'com.google.gms:google-services:4.4.4'

        // NOTE: Do not place your application dependencies here; they belong
        // in the individual module build.gradle files
    }
}

apply from: "variables.gradle"

allprojects {
    repositories {
        google()
        mavenCentral()
    }
    plugins.withType(JavaBasePlugin) {
        project.extensions.getByType(JavaPluginExtension).toolchain {
            languageVersion = JavaLanguageVersion.of(21)
        }
    }
}

subprojects {
    afterEvaluate { project ->
        if (project.hasProperty('android')) {
            def sdkDir = System.getenv('ANDROID_HOME') ?: System.getenv('ANDROID_SDK_ROOT')
            if (sdkDir && new File(sdkDir, 'build-tools/36.0.0').exists() && !new File(sdkDir, 'build-tools/35.0.0').exists()) {
                project.android.buildToolsVersion = '36.0.0'
            }
        }
    }
}

task clean(type: Delete) {
    delete rootProject.buildDir
}
